<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <!-- Font Awesome -->
 <link rel="icon" type="image/x-icon" href="https://github.com/88MVcode9/ARQUIVOS/blob/main/IMAGENS/POLICIAIS/GMA.jpeg?raw=true">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
 <link rel="stylesheet" href="https://88mvcode9.github.io/ARQUIVOS/ESTILOS/GMA/Minhas%20Revis%C3%B5es.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecione</title>

</head>
<body>

<div class="radio-inputs">

  <!-- Polícia Federal (Símbolo de águia ou brasão de armas) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/direito_penal/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Águia/Brasão simplificado -->
          <path d="M12 2l4.5 4.5V13c0 4-3 7-4.5 9C10.5 20 7.5 17 7.5 13V6.5L12 2z"/>
          <path d="M7 8h10"/>
          <path d="M12 8v12"/>
          <circle cx="12" cy="14" r="2"/>
        </svg>
      </span>
      <span class="radio-label">Polícia Federal</span>
    </span>
  </a>

  <!-- Polícia Rodoviária Federal (Carro patrulha ou estrada) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/estatuto-gm-aracaju/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Carro e estrada -->
          <path d="M5 13l2-4h10l2 4"/>
          <path d="M3 13h18v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4z"/>
          <circle cx="7" cy="17" r="1.5"/>
          <circle cx="17" cy="17" r="1.5"/>
          <path d="M12 3v3"/>
          <path d="M9 3h6"/>
        </svg>
      </span>
      <span class="radio-label">Polícia Rodoviária Federal</span>
    </span>
  </a>

  <!-- Polícia Militar (Estrela / Distintivo militar) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/direitos-constitucional/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
           <!-- Estrela policial 7 pontas / escudo circular -->
           <circle cx="12" cy="12" r="10"/>
           <path d="M12 4l2.5 5.5L20 10l-4.5 4L17 20l-5-3-5 3 1.5-6L4 10l5.5-.5L12 4z"/>
        </svg>
      </span>
      <span class="radio-label">Polícia Militar</span>
    </span>
  </a>

  <!-- Polícia Civil (Distintivo de investigação / Lupa) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/processo_penal/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Distintivo/Lupa -->
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <path d="M11 6a5 5 0 015 5"/>
        </svg>
      </span>
      <span class="radio-label">Polícia Civil</span>
    </span>
  </a>

  <!-- Polícia Penal (Grades / Prisão / Segurança) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/direitos-administrativos/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
           <!-- Cadeado e segurança -->
          <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
          <path d="M8 11V7a4 4 0 018 0v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
      </span>
      <span class="radio-label">Polícia Penal</span>
    </span>
  </a>

  <!-- Guarda Municipal (Escudo da cidade / Protetor) -->
  <a class="card-link" href="https://88mvcode9.github.io/ARQUIVOS/MATERIAL%20DE%20ESTUDOS/legislacao/">
    <span class="radio-tile">
      <span class="radio-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Escudo tradicional municipal -->
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 2v20"/>
          <path d="M4 12h16"/>
        </svg>
      </span>
      <span class="radio-label">Guarda Municipal</span>
    </span>
  </a>
</div>

</body>
</html>
